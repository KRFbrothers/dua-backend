name: Build

# Test + build only. No deploy, no registry push, no secrets.
# Test commands mirror .github/workflows/checks.yml so the two never disagree.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        run: node --test "test/**/*.test.mjs"

  engine:
    name: Engine tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements.txt
      - name: Install engine dependencies
        # pytest is not declared in any requirements*.txt in this repo, so it is
        # pinned here. checks.yml pins the same version (8.3.5).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==8.3.5
      - name: Run engine tests
        run: python -m pytest -q tests

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, engine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Node API image
        run: docker build --tag dua-api:ci apps/api
      - name: Build Python engine image
        # The engine Dockerfile defaults to REQUIREMENTS=requirements-adapters-lock.txt,
        # which is what the Cloud Run image ships. Build that same target.
        run: docker build --tag dua-ai-engine:ci apps/ai-engine
